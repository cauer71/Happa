# Veröffentlicht Happa bei jedem Push auf main auf https://happa.auer.page.
# Benötigt das Repository-Secret CLOUDFLARE_API_TOKEN (Token „Happa GitHub Deploy“).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "coach/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax prüfen
        run: for f in worker/*.js public/js/*.js public/js/views/*.js public/sw.js; do node --check --input-type=module < "$f" || { echo "Fehler in $f"; exit 1; }; done
      - name: Auf Cloudflare veröffentlichen
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c72e13538d36f6905581747d2fd5c1fc
