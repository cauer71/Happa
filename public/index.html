<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Happa</title>
  <meta name="description" content="Happa – Kalorien zählen mit Foto-Erkennung">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Happa">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/icons/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
    { "imports": {
        "preact": "/vendor/preact.mjs",
        "preact/hooks": "/vendor/preact-hooks.mjs",
        "htm": "/vendor/htm.mjs"
    } }
  </script>
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>

  <div id="app"></div>

  <!-- Startanimation: steht direkt im HTML, damit sie sofort erscheint -->
  <div id="splash" aria-hidden="true">
    <div class="splash-icon"><img src="/icons/icon.svg" alt=""></div>
    <div class="splash-name">Happa</div>
  </div>

  <!-- iOS: Das Umschalten eines Schalters löst eine Haptik aus (für kurzes Feedback) -->
  <label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <noscript>Happa braucht JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
