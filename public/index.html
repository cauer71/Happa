<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Happa</title>
  <meta name="description" content="Happa – Kalorien zählen mit Foto-Erkennung">
  <meta name="theme-color" content="#fbf3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Happa">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/icons/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
    { "imports": {
        "preact": "/vendor/preact.mjs",
        "preact/hooks": "/vendor/preact-hooks.mjs",
        "htm": "/vendor/htm.mjs"
    } }
  </script>
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>

  <div id="app"></div>

  <!-- Startanimation: steht direkt im HTML, damit sie sofort erscheint -->
  <div id="splash" aria-hidden="true">
    <div class="splash-icon"><img src="/icons/icon.svg" alt=""></div>
    <div class="splash-name">Happa</div>
  </div>

  <!-- iOS: Das Umschalten eines Schalters löst eine Haptik aus (für kurzes Feedback) -->
  <label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <noscript>Happa braucht JavaScript.</noscript>
  <script>
    // Notbremse: Startet die App nicht (z. B. veraltete Dateien im Cache), nach 15 s
    // einen Knopf zum sauberen Neuladen anzeigen statt ewig den Startbildschirm.
    window.__happaWatchdog = setTimeout(function () {
      var s = document.getElementById("splash");
      if (!s) return;
      var box = document.createElement("div");
      box.style.cssText = "display:grid;gap:12px;justify-items:center;text-align:center;font:15px -apple-system,sans-serif;max-width:280px";
      box.innerHTML = "<div>Happa startet gerade nicht.</div>";
      var b = document.createElement("button");
      b.textContent = "Neu laden";
      b.style.cssText = "height:44px;padding:0 22px;border:0;border-radius:22px;background:#bf5b52;color:#fff;font:600 16px -apple-system,sans-serif";
      b.onclick = function () {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
      box.appendChild(b);
      s.appendChild(box);
    }, 15000);
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
