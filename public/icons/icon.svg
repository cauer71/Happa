<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCBAE"/>
      <stop offset=".5" stop-color="#F3998A"/>
      <stop offset="1" stop-color="#D9727A"/>
    </linearGradient>
    <radialGradient id="bgShine" cx=".22" cy=".08" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDeep" cx=".85" cy="1" r=".75">
      <stop offset="0" stop-color="#8E3B3B" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8E3B3B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="solid" gradientUnits="userSpaceOnUse" x1="280" y1="330" x2="460" y2="780">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF6F1"/>
    </linearGradient>
    <!-- frosted glass body: bright top-left, slightly translucent toward bottom-right -->
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="720" y2="820">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".97"/>
      <stop offset="1" stop-color="#FFF5F0" stop-opacity=".80"/>
    </linearGradient>
    <linearGradient id="glassRing" gradientUnits="userSpaceOnUse" x1="250" y1="160" x2="780" y2="880">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".82"/>
    </linearGradient>
    <!-- specular rim: light from top-left -->
    <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="260" y1="200" x2="640" y2="700">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- inner shade on bottom-right edges (glass thickness) -->
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="760" y1="820" x2="420" y2="380">
      <stop offset="0" stop-color="#C0605C" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#C0605C" stop-opacity="0"/>
    </linearGradient>
    <!-- soft counter-light on the edge facing away from the light -->
    <linearGradient id="spec2" gradientUnits="userSpaceOnUse" x1="780" y1="840" x2="480" y2="460">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pitG" gradientUnits="userSpaceOnUse" cx="563.6" cy="585.3" r="99.9">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset=".55" stop-color="#F4A86A"/>
      <stop offset="1" stop-color="#D97C4E"/>
    </radialGradient>

    <path id="ring" d="M830.9 320.4A372 372 0 0 1 304 820.4A22 22 0 0 1 328.6 783.9A328 328 0 0 0 793.2 343.1A22 22 0 0 1 830.9 320.4ZM227 751.1A372 372 0 0 1 669.2 174.9A22 22 0 0 1 650.6 214.7A328 328 0 0 0 260.7 722.8A22 22 0 0 1 227 751.1Z"/>
    <path id="fork" d="M276 352A22 22 0 0 1 320 352V466A12 12 0 0 0 344 466V352A22 22 0 0 1 388 352V466A12 12 0 0 0 412 466V352A22 22 0 0 1 456 352V482C456 542 396 556 396 606V740A30 30 0 0 1 336 740V606C336 556 276 542 276 482Z"/>
    <path id="avo" d="M0 -205C52 -205 86 -168 88 -115C90 -62 150 -30 150 88C150 176 84 240 0 240C-84 240 -150 176 -150 88C-150 -30 -90 -62 -88 -115C-86 -168 -52 -205 0 -205Z" transform="translate(612 530) rotate(18) scale(.9)"/>
    <path id="leaf" d="M641 362C708,387 765,305 776 218C689.8,234.6 611.8,296.7 641 362Z"/>
    <circle id="pit" cx="585.6" cy="611.3" r="74"/>

    <clipPath id="cRing"><use xlink:href="#ring"/></clipPath>
    <clipPath id="cFork"><use xlink:href="#fork"/></clipPath>
    <clipPath id="cAvo"><use xlink:href="#avo"/></clipPath>
    <clipPath id="cLeaf"><use xlink:href="#leaf"/></clipPath>

    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000"><use xlink:href="#ring"/><use xlink:href="#fork"/><use xlink:href="#avo"/><use xlink:href="#leaf"/></g>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgShine)"/>
  <rect width="1024" height="1024" fill="url(#bgDeep)"/>

  <!-- soft drop shadow, only outside the glass so the glass stays clean -->
  <g mask="url(#outside)">
    <g filter="url(#soft)" fill="#7A3030" opacity=".30" transform="translate(0 18)">
      <use xlink:href="#ring"/><use xlink:href="#fork"/><use xlink:href="#avo"/><use xlink:href="#leaf"/>
    </g>
  </g>

  <!-- ring -->
  <use xlink:href="#ring" fill="url(#glassRing)"/>
  <g clip-path="url(#cRing)" fill="none">
    <use xlink:href="#ring" stroke="url(#spec)" stroke-width="9"/>
    <use xlink:href="#ring" stroke="url(#shade)" stroke-width="12"/>
    <use xlink:href="#ring" stroke="url(#spec2)" stroke-width="4"/>
  </g>

  <!-- fork -->
  <use xlink:href="#fork" fill="url(#solid)"/>
  <g clip-path="url(#cFork)" fill="none">
    <use xlink:href="#fork" stroke="url(#spec)" stroke-width="9"/>
    <use xlink:href="#fork" stroke="url(#shade)" stroke-width="12"/>
    <use xlink:href="#fork" stroke="url(#spec2)" stroke-width="4"/>
  </g>

  <!-- leaf -->
  <use xlink:href="#leaf" fill="url(#glass)" opacity=".9"/>
  <g clip-path="url(#cLeaf)" fill="none">
    <use xlink:href="#leaf" stroke="url(#spec)" stroke-width="9"/>
    <use xlink:href="#leaf" stroke="url(#shade)" stroke-width="12"/>
    <use xlink:href="#leaf" stroke="url(#spec2)" stroke-width="4"/>
  </g>
  <g clip-path="url(#cLeaf)"><use xlink:href="#avo" fill="#8E3B3B" opacity=".28" filter="url(#soft)" transform="translate(0 10)"/></g>
  <path d="M673.4 327.4L740.9 255.4" fill="none" stroke="#E98A7E" stroke-opacity=".5" stroke-width="9" stroke-linecap="round"/>

  <!-- avocado -->
  <use xlink:href="#avo" fill="url(#glass)"/>
  <g clip-path="url(#cAvo)" fill="none">
    <use xlink:href="#avo" stroke="#FFC2B0" stroke-opacity=".5" stroke-width="44"/>
    <use xlink:href="#avo" stroke="url(#spec)" stroke-width="9"/>
    <use xlink:href="#avo" stroke="url(#shade)" stroke-width="12"/>
    <use xlink:href="#avo" stroke="url(#spec2)" stroke-width="4"/>
  </g>

  <!-- pit: tinted glass bead -->
  <circle cx="585.6" cy="619.3" r="74" fill="#A0482F" opacity=".18" filter="url(#soft)"/>
  <use xlink:href="#pit" fill="url(#pitG)"/>
  <circle cx="585.6" cy="611.3" r="71" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
  <ellipse cx="563.6" cy="583.3" rx="20" ry="12" transform="rotate(-35 563.6 583.3)" fill="#fff" opacity=".75"/>
</svg>
